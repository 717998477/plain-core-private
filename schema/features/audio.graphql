type ActionResult {
	affectedCount: Int!
}

"""
One track of the playback queue / a playlist (plain-app `AudioItem`).
"""
type AudioItem {
	mediaId: ID
	title: String!
	artist: String!
	path: String!
	durationMs: Long!
}

type AudioMutation {
	playAudio(mediaId: ID!): AudioItem!
	playAudioByPath(path: String!): AudioItem!
	updateAudioPlayMode(mode: MediaPlayMode!): Boolean!
	clearAudioQueue: Boolean!
	removeAudioFromQueue(mediaId: ID!): Boolean!
	addAudioToQueue(query: String!): Boolean!
	reorderAudioQueue(mediaIds: [ID!]!): Boolean!
	createAudioPlaylist(name: String!): AudioPlaylist!
	updateAudioPlaylist(id: ID!, name: String!): AudioPlaylist!
	deleteAudioPlaylist(id: ID!): Boolean!
	addAudioPlaylistItems(id: ID!, query: String!): Boolean!
	removeAudioPlaylistItem(id: ID!, query: String!): ActionResult!
}

"""
Recently played track (plain-app `AudioPlayHistory`).
"""
type AudioPlayHistory {
	mediaId: ID!
	path: String!
	title: String!
	artist: String!
	durationMs: Long!
	playCount: Int!
	playedAt: Instant!
}

"""
Audio player state (plain-app `AudioPlayback`). The desktop backend has
no playback engine — the queue is the shared state machine, the client
renders audio.
"""
type AudioPlayback {
	mode: MediaPlayMode!
	mediaId: ID
	path: String
	isPlaying: Boolean!
	positionMs: Long!
}

"""
A user playlist (plain-app `AudioPlaylist`); `itemCount` is live.
"""
type AudioPlaylist {
	id: ID!
	name: String!
	itemCount: Int!
	createdAt: Instant!
	updatedAt: Instant!
}

type AudioQuery {
	audioQueueItems(query: String!, offset: Int!, limit: Int!): [AudioItem!]!
	audioQueueItemCount: Int!
	audioPlayback: AudioPlayback!
	audioPlaylists: [AudioPlaylist!]!
	audioPlaylistItems(id: ID!, query: String!, offset: Int!, limit: Int!): [AudioItem!]!
	audioPlaylistItemCount(id: ID!, query: String!): Int!
	audioPlayHistoryCount: Int!
	audioPlayHistory(query: String!, offset: Int!, limit: Int!): [AudioPlayHistory!]!
}

enum MediaPlayMode {
	REPEAT
	REPEAT_ONE
	SHUFFLE
}

